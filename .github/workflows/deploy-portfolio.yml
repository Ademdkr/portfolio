name: Portfolio CI/CD

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: portfolio-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Tests and static Pages build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:ci
      - run: pnpm run cloudflare:build
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-pages
          path: dist/portfolio/browser
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy and verify Cloudflare
    needs: validate
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_URL: https://adem-portfolio.pages.dev
      SITE_URL: ${{ vars.PRODUCTION_SITE_URL || 'https://adem-portfolio.pages.dev' }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Check deployment credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to the production environment.'
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: portfolio-pages
          path: dist/portfolio/browser
      - name: Publish the validated build
        run: pnpm exec wrangler pages deploy --project-name=adem-portfolio --branch=master --commit-hash="$GITHUB_SHA" --commit-dirty=false
      - name: Verify published routes and Git version
        run: |
          for attempt in $(seq 1 10); do
            if node scripts/verify-pages.mjs "$PAGES_URL"; then
              if [ "$SITE_URL" != "$PAGES_URL" ]; then
                node scripts/verify-pages.mjs "$SITE_URL"
              fi
              exit 0
            fi
            echo "Waiting for Pages ($attempt/10)"
            sleep 5
          done
          echo '::error::The published site did not pass verification.'
          exit 1
